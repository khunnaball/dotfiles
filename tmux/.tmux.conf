# ~/.tmux.conf

# ---- Core behaviour ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"     # true colour support
set -g mouse on
set -g history-limit 50000
set -g escape-time 0            # kill the lag after pressing Escape (matters for Helix/vim)
set -g focus-events on
set -g scroll-on-clear off      # stop full-screen redraws (e.g. Claude Code) dumping into history
set -g base-index 1             # windows numbered from 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on

# ---- Prefix: C-a instead of C-b (easier reach, no Helix conflict) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Reload config without restarting tmux ----
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ---- Splits: mnemonic keys, open in current path ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Pane navigation: vim-style ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Pane resizing: repeatable with prefix held ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Copy mode: vi keys, yank like vim ----
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# On macOS, send yanked text to system clipboard (needs `brew install reattach-to-user-namespace`
# only on very old macOS/tmux — modern tmux + iTerm2/Ghostty handle this natively via pbcopy).
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'"

# On WSL2, send yanked text to the Windows clipboard via clip.exe
if-shell "grep -qi microsoft /proc/version 2>/dev/null" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'"

# ---- Status bar: warm dark theme (Bearded Coffee-ish palette) ----
set -g status-position bottom
set -g status-style "bg=#2c2620,fg=#d4be98"
set -g status-interval 5        # refresh #() segments (git branch, battery) every 5s
set -g status-left-length 30
# Session pill turns sand-coloured while the prefix (C-a) is armed
set -g status-left "#{?client_prefix,#[bg=#d4be98],#[bg=#a35c33]}#[fg=#2c2620,bold] #S #[bg=#2c2620,fg=#a35c33] "
set -g status-right-length 100
# Flag set when tmux itself is running on a machine you've SSH'd into
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @remote_session 1'
# ssh target of the active pane · remote host · git branch · battery · date · time
set -g status-right "#{?#{==:#{pane_current_command},ssh},#[fg=#2c2620#,bg=#8a7a68#,bold] ssh: #(~/.tmux/scripts/ssh-host.sh #{pane_pid}) #[bg=#2c2620#,nobold] ,}\
#{?@remote_session,#[fg=#a35c33#,bold]@#h #[nobold],}\
#[fg=#8a7a68]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/⎇ /') \
#[fg=#8a7a68]#(~/.tmux/scripts/battery.sh) \
#[bg=#a35c33,fg=#2c2620] %a %d %b #[bg=#2c2620,fg=#d4be98] %H:%M "

# Windows: show a [Z] marker when a pane is zoomed (prefix + z)
setw -g window-status-format " #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[bg=#d4be98,fg=#2c2620,bold] #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-style "bg=#d4be98,fg=#2c2620"

set -g pane-border-style "fg=#4a4139"
set -g pane-active-border-style "fg=#a35c33"

set -g message-style "bg=#a35c33,fg=#2c2620,bold"

# ---- Suggested layout for a Claude Code + lazygit + shell session ----
# Not automatic — run these manually, or wrap in a shell script / tmuxinator-style
# script later once the base feels good:
#
#   tmux new -s work
#   <run claude in this pane>
#   prefix + |         (split right)
#   <run lazygit>
#   prefix + -          (split below lazygit)
#   <plain shell>

# prefix + f: fuzzy-find a project dir in a popup and switch to (or create) its session
bind f display-popup -E "tmux-sessionizer"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @plugin 'rickstaa/tmux-notify'

# Initialize TMUX plugin manager (Keep at bottom of file).
run '~/.tmux/plugins/tpm/tpm'
